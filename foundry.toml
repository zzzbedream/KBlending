[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# KUB Chain runs a pre-Shanghai EVM and rejects the PUSH0 opcode (0x5f).
# Compile for "paris" so Solidity never emits PUSH0.
evm_version = "paris"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# RPC endpoints for KUB Chain (Bitkub Chain). Values are read from the environment
# so private infrastructure/keys never land in the repo. See .env.example.
[rpc_endpoints]
kub_testnet = "${KUB_TESTNET_RPC_URL}"
kub_mainnet = "${KUB_MAINNET_RPC_URL}"

# Contract verification. Bitkub Chain block explorers are Blockscout-based, so
# verification runs through the Blockscout verifier, e.g.:
#   forge verify-contract <addr> src/LendingVault.sol:LendingVault \
#     --chain-id 25925 --verifier blockscout \
#     --verifier-url https://testnet.bkcscan.com/api
# The URLs below are best-known defaults — confirm the live explorer/API host
# before verifying, as Bitkub has migrated explorers historically.
[etherscan]
kub_testnet = { key = "${KUBSCAN_API_KEY}", url = "https://testnet.bkcscan.com/api", chain = 25925 }
kub_mainnet = { key = "${KUBSCAN_API_KEY}", url = "https://www.bkcscan.com/api", chain = 96 }
